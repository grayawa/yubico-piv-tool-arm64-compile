name: Windows ARM64

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "common/**"
      - "lib/**"
      - "ykcs11/**"
      - "tool/**"
      - "aes_cmac/**"
      - "resources/release/**"

permissions:
  contents: read

jobs:
  source-dist:
    name: Create Windows-compatible source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install source distribution prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc libpcsclite-dev check gengetopt help2man zlib1g-dev

      - name: Create source archive
        shell: bash
        run: |
          set -euxo pipefail
          version="$(sed -n 's/^set (yubico_piv_tool_VERSION_MAJOR \([0-9]*\))/\1/p' CMakeLists.txt).$(sed -n 's/^set (yubico_piv_tool_VERSION_MINOR \([0-9]*\))/\1/p' CMakeLists.txt).$(sed -n 's/^set (yubico_piv_tool_VERSION_PATCH \([0-9]*\))/\1/p' CMakeLists.txt)"
          ./resources/release/make_src_dist.sh "$version"
          mkdir -p dist
          mv "yubico-piv-tool-$version.tar.gz" dist/

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: yubico-piv-tool-source
          path: dist/yubico-piv-tool-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-arm64:
    name: Build native Windows ARM64
    needs: source-dist
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: yubico-piv-tool-source
          path: source

      - name: Extract source
        shell: pwsh
        run: |
          $archive = Get-ChildItem source -Filter *.tar.gz | Select-Object -First 1
          if (-not $archive) { throw "Source archive was not downloaded" }
          tar -xzf $archive.FullName
          $sourceDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "yubico-piv-tool-*" } | Select-Object -First 1
          if (-not $sourceDir) { throw "Could not find extracted source directory" }
          "SOURCE_DIR=$($sourceDir.FullName)" >> $env:GITHUB_ENV

      - name: Install ARM64 dependencies with vcpkg
        shell: pwsh
        run: |
          $vcpkgCommand = Get-Command vcpkg -ErrorAction Stop
          $vcpkgRoot = Split-Path $vcpkgCommand.Source
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          & $vcpkgCommand.Source install openssl getopt check zlib --triplet arm64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build
        shell: pwsh
        run: |
          $tripletRoot = Join-Path $env:VCPKG_ROOT "installed\arm64-windows"
          $env:OPENSSL_ROOT_DIR = $tripletRoot
          $env:Path = "$(Join-Path $tripletRoot 'bin');$env:Path"

          $cmakeArgs = @(
            "-S", $env:SOURCE_DIR,
            "-B", "build",
            "-A", "ARM64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE\stage",
            "-DBACKEND=winscard",
            "-DGETOPT_LIB_DIR=$(Join-Path $tripletRoot 'lib')",
            "-DGETOPT_INCLUDE_DIR=$(Join-Path $tripletRoot 'include')",
            "-DCHECK_PATH=$tripletRoot",
            "-DZLIB_LIB_DIR=$(Join-Path $tripletRoot 'lib')",
            "-DZLIB_INCL_DIR=$(Join-Path $tripletRoot 'include')",
            "-DZLIB_ROOT=$tripletRoot",
            "-DSUPRESS_MSVC_WARNINGS=ON",
            "-DGENERATE_MAN_PAGES=OFF"
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        shell: pwsh
        run: |
          $tripletRoot = Join-Path $env:VCPKG_ROOT "installed\arm64-windows"
          $env:Path = "$(Join-Path $tripletRoot 'bin');$env:GITHUB_WORKSPACE\build\lib\Release;$env:GITHUB_WORKSPACE\build\ykcs11\Release;$env:Path"
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and assemble portable package
        shell: pwsh
        run: |
          $tripletRoot = Join-Path $env:VCPKG_ROOT "installed\arm64-windows"
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Path "stage\bin\*" -Destination package -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "stage\lib\*" -Destination package -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path (Join-Path $tripletRoot "bin\*.dll") -Destination package -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:SOURCE_DIR\COPYING" -Destination package\LICENSE -Force

          @"
          Yubico PIV Tool - Windows ARM64
          Built from the Yubico PIV Tool source distribution by GitHub Actions.
          Backend: Windows WinSCard.
          Architecture: ARM64.

          Place this directory on PATH to use yubico-piv-tool.exe.
          For OpenSSH PKCS#11 use the absolute path to libykcs11.dll as PKCS11Provider.
          "@ | Set-Content package\README.txt

          foreach ($dll in Get-ChildItem package -Filter *.dll) {
            $dump = & dumpbin /headers $dll.FullName 2>&1 | Out-String
            if ($dump -notmatch "AA64 machine") {
              throw "Non-ARM64 DLL detected: $($dll.Name)"
            }
          }
          $exeDump = & dumpbin /headers package\yubico-piv-tool.exe 2>&1 | Out-String
          if ($exeDump -notmatch "AA64 machine") {
            throw "yubico-piv-tool.exe is not ARM64"
          }

          Get-ChildItem package -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content package\SHA256SUMS

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: yubico-piv-tool-windows-arm64
          path: package/
          if-no-files-found: error
          retention-days: 30
